name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.19
  NODE_OPTIONS: --max-old-space-size=16384

jobs:
  lint-and-types:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:styles

      - name: Unused code (knip)
        run: npm run lint:unused

      - name: Format check
        run: npm run format:check

      # vue-tsc -b: исходники вместе с тестами и stories (tsconfig.app.json) и конфиги сборки (tsconfig.node.json).
      # Сборка ниже проверяет только tsconfig.lib.json (без *.spec.ts), поэтому ошибки типов в тестах туда не попадают.
      - name: Type check (app, tests, build configs)
        run: npm run typecheck

      - name: Type check & build
        run: npm run build

  quality-gates:
    name: Stories & A11y Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check missing stories
        run: node scripts/check-stories-coverage.mjs

      - name: Check missing play/keyboard a11y
        run: node scripts/check-a11y-coverage.mjs

      - name: Check UI strings go through the locale dictionaries
        run: npm run test:l10n

      - name: Check slot descriptions in Docs
        run: npm run test:slot-docs

      - name: Check «Show code» is the exact preview code
        run: npm run test:story-source

  stories-run:
    name: Stories Run (render, play, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      # Каждая story в светлой и тёмной теме: рендер, play-функция, axe, без внешних запросов
      - name: Run all stories
        run: |
          node scripts/serve-storybook-static.mjs &
          npx wait-on http://localhost:6006
          npm run test:stories -- --concurrency=3 --report=test-results/stories-report.json

      - name: Upload stories report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stories-report
          path: test-results/stories-report.json
          retention-days: 14

      # Пары «текст/фон» дизайн-токенов обеих тем — не ниже WCAG AA (docs/design/contrast.md)
      - name: Check design token contrast
        run: npm run test:contrast

  unit-tests:
    name: Unit & Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Components coverage (100% per file)
        run: npm run test:components:coverage

      - name: Composables coverage (100% per file)
        run: npm run test:composables:coverage

      - name: Utils coverage (100% per file)
        run: npm run test:utils:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14

  e2e-and-visual:
    name: E2E & Visual Regression
    runs-on: ubuntu-latest
    # contents: write нужен только шагу auto-commit обновлённых baseline (он запускается лишь по метке, см. ниже)
    permissions:
      contents: write
    env:
      # Обновление baseline — осознанное действие: только PR из этого репозитория с меткой visual:update-baselines.
      # Без метки упавший visual-тест остаётся падением, а не превращается в автокоммит новых скриншотов.
      UPDATE_VISUAL_BASELINES: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'visual:update-baselines') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git-auto-commit-action не может запушить из merge-коммита PR (detached HEAD) — для обновления baseline нужна ветка PR
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run E2E & visual against built Storybook
        run: |
          node scripts/serve-storybook-static.mjs &
          npx wait-on http://localhost:6006
          npm run test:e2e
          npm run test:visual
        env:
          PLAYWRIGHT_REUSE_SERVER: "true"

      # === Cross-platform baseline regeneration ===
      # Без `if: always()` этот шаг skipped бы по дефолту, когда visual-тесты
      # упали на platform-различиях (как раз та ситуация, ради которой шаг
      # и нужен). Только на pull_request с меткой visual:update-baselines: никогда не на main,
      # head.repo.full_name == github.repository защищает от форков, а метка — от автоматического
      # «лечения» настоящей визуальной регрессии коммитом новых скриншотов.
      - name: Regenerate visual baselines on Linux
        if: always() && env.UPDATE_VISUAL_BASELINES == 'true'
        run: |
          node scripts/serve-storybook-static.mjs &
          npx wait-on http://localhost:6006
          npx playwright test --config build/tests/playwright.config.ts --project=visual-chromium --update-snapshots
        env:
          PLAYWRIGHT_REUSE_SERVER: "true"

      - name: Commit updated baselines to PR
        if: always() && env.UPDATE_VISUAL_BASELINES == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(visual): regenerate baselines for Linux CI (auto)"
          file_pattern: "tests/visual-snapshots/**/*.png"

      - name: Upload Playwright results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            tests/visual-snapshots/**/__screenshots__/*-diff.png
          retention-days: 14
